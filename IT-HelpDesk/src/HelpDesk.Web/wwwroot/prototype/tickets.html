<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets — static prototype</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/site.css" />
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">IT Help Desk</a>
            <a class="nav-link text-white" href="tickets.html">Müraciətlər</a>
        </div>
    </nav>
    <main class="container">
        <h1 class="h3 mb-3">Müraciətlər</h1>
        <div class="card card-body mb-3">
            <div class="row g-2">
                <div class="col-md-4">
                    <label class="form-label" for="proto-category">Kateqoriya</label>
                    <select id="proto-category" class="form-select"><option value="">Hamısı</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="proto-status">Status</label>
                    <select id="proto-status" class="form-select">
                        <option value="">Hamısı</option>
                        <option>New</option><option>In Progress</option><option>Resolved</option><option>Closed</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-light"><tr><th>#</th><th>Başlıq</th><th>Kateqoriya</th><th>Prioritet</th><th>Status</th></tr></thead>
                <tbody id="proto-tickets"></tbody>
            </table>
        </div>
    </main>
    <script src="../js/prototype.js"></script>
</body>
</html>
